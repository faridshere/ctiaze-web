# Low-noise weekly dependency updates, grouped so minor/patch bumps arrive as one
# PR (Next/React security patches land on the newest minor first — this keeps the
# patch window tight without constant churn). github-actions kept fresh too.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps the Next 16 toolchain doesn't support yet (audit "hold" list):
      # TypeScript 7 is the native-compiler rewrite; ESLint 10's ecosystem lags.
      # These majors fail the build — let minor/patch through, hold the majors until
      # Next's toolchain validates them (then bump deliberately, not by drift).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
