name: ci

# The only automated check before this was Vercel's deploy build. `eslint` and
# `tsc --noEmit` never ran on push, so a type error in a rarely-built path or the
# known i18n foot-gun (lib/i18n.ts must never import next/headers) could land
# silently. `next build` stays out of CI on purpose — it needs the read-only Mongo
# env and Vercel already runs it on deploy; lint + typecheck are the missing gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Least privilege. This repo is PUBLIC, so a fork PR can run this workflow;
# it only ever needs to read the checkout. Declared after a 2026-09-07
# pentest found no workflow in either repo scoped its token at all.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      # The 92 offline tests were never in CI, though this repo's own
      # instructions call them the floor. They cover the proof-of-work
      # replay gate, the CVE-permalink collision fix and the spreadsheet
      # formula-injection guard — each written after a real incident.
      - run: npm test
