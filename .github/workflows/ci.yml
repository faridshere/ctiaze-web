name: ci

# The only automated check before this was Vercel's deploy build. `eslint` and
# `tsc --noEmit` never ran on push, so a type error in a rarely-built path or the
# known i18n foot-gun (lib/i18n.ts must never import next/headers) could land
# silently. `next build` stays out of CI on purpose — it needs the read-only Mongo
# env and Vercel already runs it on deploy; lint + typecheck are the missing gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
